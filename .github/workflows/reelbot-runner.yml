name: ReelBot runner

on:
  workflow_dispatch:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

permissions:
  contents: read

concurrency:
  group: reelbot-runner
  cancel-in-progress: false

jobs:
  poll-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache faster-whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: faster-whisper-small-${{ runner.os }}-v1

      - name: Ensure FFmpeg is installed
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Install runner dependencies
        run: python -m pip install -r requirements.txt

      - name: Claim and render queued jobs
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL || 'https://reelbot-gateway.retyn-reelbot.workers.dev' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WHISPER_MODEL: small
          HOOK_MODEL: claude-sonnet-5-5
        run: python runner.py
